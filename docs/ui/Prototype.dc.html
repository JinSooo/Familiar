<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>宠物与迷你胶囊交互原型</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <style>
          body {
            margin: 0;
          }
          a {
            color: #0a66d8;
          }
          a:hover {
            color: #0852ae;
          }
          .sp {
            width: 115.2px;
            height: 124.8px;
            background-repeat: no-repeat;
            background-image: url(/_blob/709757c5e1c73fd33c1745d22616def5);
            background-size: 921.6px 1123.2px;
          }
          .sp.x {
            background-image: url(/_blob/fac2be1e7cea985f67dd6133186aca52);
            background-size: 921.6px 748.8px;
          }
          @keyframes f4 {
            from {
              background-position-x: 0;
            }
            to {
              background-position-x: -460.8px;
            }
          }
          @keyframes f5 {
            from {
              background-position-x: 0;
            }
            to {
              background-position-x: -576px;
            }
          }
          @keyframes f6 {
            from {
              background-position-x: 0;
            }
            to {
              background-position-x: -691.2px;
            }
          }
          .sp.idle {
            background-position-y: 0;
            animation: f6 1.1s steps(6) infinite;
          }
          .sp.wave {
            background-position-y: -374.4px;
            animation: f4 0.45s steps(4) 2;
          }
          .sp.jump {
            background-position-y: -499.2px;
            animation: f5 0.6s steps(5) 1;
          }
          .sp.waiting {
            background-position-y: -748.8px;
            animation: f6 0.9s steps(6) infinite;
          }
          .sp.work {
            background-position-y: -873.6px;
            animation: f6 0.8s steps(6) infinite;
          }
          .sp.review {
            background-position-y: -998.4px;
            animation: f6 1s steps(6) infinite;
          }
          .sp.failed {
            background-position-y: -624px;
            animation: f6 0.8s steps(6) 2;
          }
          .sp.x.listening {
            background-position-y: 0;
            animation: f6 1s steps(6) infinite;
          }
          .sp.x.talking {
            background-position-y: -124.8px;
            animation: f6 0.6s steps(6) infinite;
          }
          .sp.x.sleeping {
            background-position-y: -249.6px;
            animation: f6 2.2s steps(6) infinite;
          }
          .sp.x.petted {
            background-position-y: -374.4px;
            animation: f6 0.9s steps(6) 1;
          }
          .sp.x.worried {
            background-position-y: -624px;
            animation: f6 1.2s steps(6) infinite;
          }
          @keyframes pop {
            from {
              opacity: 0;
              transform: translateY(6px) scale(0.96);
            }
            to {
              opacity: 1;
              transform: none;
            }
          }
          .pop {
            animation: pop 0.22s cubic-bezier(0.2, 0.9, 0.3, 1.2) both;
          }
          @keyframes grow {
            from {
              opacity: 0;
              transform: translateX(24px) scaleX(0.6);
            }
            to {
              opacity: 1;
              transform: none;
            }
          }
          .grow {
            transform-origin: right center;
            animation: grow 0.26s cubic-bezier(0.2, 0.9, 0.3, 1.1) both;
          }
        </style>
      </helmet>
      <div
        style="
          width: 960px;
          height: 620px;
          position: relative;
          overflow: hidden;
          background: #8fa3b5;
          font-family:
            -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC',
            system-ui, sans-serif;
          font-size: 13px;
          color: #1d1d1f;
        "
      >
        <div
          aria-hidden="true"
          style="
            position: absolute;
            left: -120px;
            top: 260px;
            width: 760px;
            height: 520px;
            border-radius: 50%;
            background: #6e869c;
          "
        ></div>
        <div
          aria-hidden="true"
          style="
            position: absolute;
            right: -160px;
            top: -200px;
            width: 640px;
            height: 560px;
            border-radius: 50%;
            background: #b9c6d2;
          "
        ></div>
        <div
          aria-hidden="true"
          style="
            position: absolute;
            right: 120px;
            bottom: -260px;
            width: 520px;
            height: 420px;
            border-radius: 50%;
            background: #c9b79c;
          "
        ></div>

        <div
          style="
            position: absolute;
            left: 24px;
            top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 12px 14px;
            border-radius: 12px;
            background: rgba(250, 250, 250, 0.82);
            backdrop-filter: blur(20px);
            box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.12);
            max-width: 360px;
          "
        >
          <span style="font-size: 12px; font-weight: 600"
            >交互原型 · 点「Play」后试试</span
          >
          <span style="font-size: 12px; line-height: 1.5; color: #4a4a4f"
            >点小黑打开胶囊 → 打字（它会竖耳朵听）→ 回车发送（看书思考 →
            张嘴说话 → 回复挂在头顶）。也可以用下面的按钮切换其他状态。</span
          >
          <div style="display: flex; flex-wrap: wrap; gap: 6px">
            <button
              onClick="{{doPet}}"
              style="
                height: 24px;
                padding: 0 10px;
                border-radius: 6px;
                border: 0;
                background: #ffffff;
                box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.2);
                font-family: inherit;
                font-size: 12px;
              "
            >
              摸摸头
            </button>
            <button
              onClick="{{doApproval}}"
              style="
                height: 24px;
                padding: 0 10px;
                border-radius: 6px;
                border: 0;
                background: #ffffff;
                box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.2);
                font-family: inherit;
                font-size: 12px;
              "
            >
              需要审批
            </button>
            <button
              onClick="{{doWorried}}"
              style="
                height: 24px;
                padding: 0 10px;
                border-radius: 6px;
                border: 0;
                background: #ffffff;
                box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.2);
                font-family: inherit;
                font-size: 12px;
              "
            >
              卡住很久
            </button>
            <button
              onClick="{{doFail}}"
              style="
                height: 24px;
                padding: 0 10px;
                border-radius: 6px;
                border: 0;
                background: #ffffff;
                box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.2);
                font-family: inherit;
                font-size: 12px;
              "
            >
              出错
            </button>
            <button
              onClick="{{doSleep}}"
              style="
                height: 24px;
                padding: 0 10px;
                border-radius: 6px;
                border: 0;
                background: #ffffff;
                box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.2);
                font-family: inherit;
                font-size: 12px;
              "
            >
              睡觉
            </button>
            <button
              onClick="{{doReset}}"
              style="
                height: 24px;
                padding: 0 10px;
                border-radius: 6px;
                border: 0;
                background: #ffffff;
                box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.2);
                font-family: inherit;
                font-size: 12px;
              "
            >
              重置
            </button>
          </div>
          <span style="font-size: 11px; color: #6e6e73"
            >当前动作：{{stateLabel}}</span
          >
        </div>

        <sc-if value="{{bubbleVisible}}" hint-placeholder-val="{{ true }}">
          <div
            class="pop"
            style="
              position: absolute;
              right: 56px;
              bottom: 182px;
              max-width: 250px;
              padding: 9px 13px;
              border-radius: 16px;
              background: rgba(250, 250, 250, 0.84);
              backdrop-filter: blur(24px) saturate(1.6);
              box-shadow:
                0 6px 20px rgba(0, 0, 0, 0.16),
                0 0 0 0.5px rgba(0, 0, 0, 0.12);
            "
          >
            <p
              style="
                margin: 0;
                font-size: 13px;
                line-height: 1.45;
                color: #1d1d1f;
                white-space: pre-line;
              "
            >
              {{bubble}}
            </p>
            <span
              aria-hidden="true"
              style="
                position: absolute;
                right: 44px;
                bottom: -5px;
                width: 10px;
                height: 10px;
                border-radius: 50%;
                background: #a6d46a;
                box-shadow: 0 0 0 2px rgba(250, 250, 250, 0.84);
              "
            ></span>
          </div>
        </sc-if>

        <sc-if value="{{capsuleOpen}}" hint-placeholder-val="{{ true }}">
          <div
            class="grow"
            style="
              position: absolute;
              right: 196px;
              bottom: 74px;
              width: 300px;
              height: 40px;
              box-sizing: border-box;
              display: flex;
              align-items: center;
              gap: 2px;
              padding: 0 4px 0 6px;
              border-radius: 20px;
              background: rgba(250, 250, 250, 0.82);
              backdrop-filter: blur(24px) saturate(1.6);
              box-shadow:
                0 8px 24px rgba(0, 0, 0, 0.18),
                0 0 0 0.5px rgba(0, 0, 0, 0.12);
            "
          >
            <a
              href="ChatLight.dc.html"
              aria-label="展开聊天"
              style="
                width: 30px;
                height: 30px;
                flex-shrink: 0;
                border-radius: 15px;
                display: flex;
                align-items: center;
                justify-content: center;
                color: #6e6e73;
              "
            >
              <svg
                width="15"
                height="15"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"></path>
              </svg>
            </a>
            <label
              for="proto-input"
              style="
                position: absolute;
                width: 1px;
                height: 1px;
                overflow: hidden;
                clip: rect(0 0 0 0);
              "
              >问小黑</label
            >
            <input
              id="proto-input"
              placeholder="问小黑…"
              value="{{input}}"
              onChange="{{onInput}}"
              onKeyDown="{{onKey}}"
              style="
                flex-grow: 1;
                min-width: 0;
                height: 30px;
                border: 0;
                outline: none;
                background: transparent;
                font-family: inherit;
                font-size: 13px;
                color: #1d1d1f;
              "
            />
            <button
              onClick="{{send}}"
              aria-label="发送"
              style="width: 30px; height: 30px; flex-shrink: 0; border-radius: 15px; border: 0; background: {{sendBg}}; display: flex; align-items: center; justify-content: center; color: #FFFFFF"
            >
              <svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.6"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M12 19V5M5 12l7-7 7 7"></path>
              </svg>
            </button>
          </div>
        </sc-if>

        <button
          onClick="{{clickPet}}"
          aria-label="小黑"
          style="
            position: absolute;
            right: 68px;
            bottom: 42px;
            width: 116px;
            height: 126px;
            padding: 0;
            border: 0;
            background: transparent;
            cursor: pointer;
          "
        >
          <div class="{{spriteClass}}"></div>
          <span
            aria-hidden="true"
            style="
              position: absolute;
              right: 18px;
              top: 14px;
              width: 8px;
              height: 8px;
              border-radius: 50%;
              background: #34c759;
              box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.9);
            "
          ></span>
        </button>
      </div>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"$preview":{"width":960,"height":620}}'
    >
      class Component extends DCLogic {
        constructor(props) {
          super(props);
          this.state = { mode: 'wave', capsule: false, input: '', bubble: '' };
          this.timers = [];
        }
        componentDidMount() { this.later(900, () => this.setMode('idle')); }
        componentWillUnmount() { this.clear(); }
        clear() { this.timers.forEach((t) => clearTimeout(t)); this.timers = []; if (this.stream) clearInterval(this.stream); this.stream = null; }
        later(ms, fn) { this.timers.push(setTimeout(fn, ms)); }
        setMode(mode) { this.setState({ mode }); }
        oneShot(mode, ms, after) { this.clear(); this.setState({ mode }); this.later(ms, () => this.setMode(after || 'idle')); }
        reply(text) {
          this.clear();
          this.setState({ mode: 'work', bubble: '', input: '' });
          this.later(1600, () => {
            this.setState({ mode: 'talking' });
            let i = 0;
            this.stream = setInterval(() => {
              i += 1;
              this.setState({ bubble: text.slice(0, i) });
              if (i >= text.length) { clearInterval(this.stream); this.stream = null; this.later(500, () => this.setMode('review')); }
            }, 45);
          });
        }
        renderVals() {
          const s = this.state;
          const extra = { listening: 1, talking: 1, sleeping: 1, petted: 1, worried: 1 };
          const labels = { idle: '待机', wave: '挥手', listening: '倾听（扩展动作）', work: '思考 / 干活', talking: '说话（扩展动作）', review: '回复完成，等你看', waiting: '需要你', failed: '出错', petted: '被摸头（扩展动作）', worried: '担心（扩展动作）', sleeping: '睡觉（扩展动作）', jump: '开心' };
          return {
            spriteClass: 'sp ' + (extra[s.mode] ? 'x ' : '') + s.mode,
            stateLabel: labels[s.mode] || s.mode,
            capsuleOpen: s.capsule,
            bubbleVisible: Boolean(s.bubble),
            bubble: s.bubble,
            input: s.input,
            sendBg: s.input.trim() ? '#0A66D8' : '#AEAEB2',
            clickPet: () => {
              const opening = !this.state.capsule;
              this.setState({ capsule: opening, bubble: this.state.mode === 'review' ? this.state.bubble : '' });
              this.oneShot('wave', 900, 'idle');
            },
            onInput: (e) => {
              const v = e.target.value;
              this.setState({ input: v });
              if (['idle', 'listening', 'review', 'wave'].includes(this.state.mode)) this.setMode(v.trim() ? 'listening' : 'idle');
            },
            onKey: (e) => { if (e.key === 'Enter' && !e.nativeEvent.isComposing) { e.preventDefault(); this.sendNow(); } },
            send: () => this.sendNow(),
            doPet: () => this.oneShot('petted', 950, 'idle'),
            doApproval: () => { this.clear(); this.setState({ mode: 'waiting', bubble: '要把 23 张截图挪到 ~/Pictures 吗？点我看看' }); },
            doWorried: () => { this.clear(); this.setState({ mode: 'worried', bubble: '这个报错你看了 40 分钟了，要我帮忙吗？' }); },
            doFail: () => { this.clear(); this.setState({ mode: 'failed', bubble: '模型没连上，检查一下网络？' }); this.later(1700, () => this.setMode('idle')); },
            doSleep: () => { this.clear(); this.setState({ mode: 'sleeping', bubble: '', capsule: false }); },
            doReset: () => { this.clear(); this.setState({ mode: 'wave', capsule: false, input: '', bubble: '' }); this.later(900, () => this.setMode('idle')); },
          };
        }
        sendNow() {
          if (!this.state.input.trim()) return;
          this.reply('user 可能是 undefined，第 42 行先判空就好。要我直接改吗？');
        }
      }
    </script>
  </body>
</html>
