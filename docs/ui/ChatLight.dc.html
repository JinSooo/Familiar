<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>展开的聊天面板浅色</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <style>
          body {
            margin: 0;
          }
          a {
            color: #0a66d8;
          }
          a:hover {
            color: #0852ae;
          }
        </style>
      </helmet>
      <div
        style="
          width: 380px;
          height: 620px;
          position: relative;
          overflow: hidden;
          background: #a9b8c6;
          font-family:
            -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC',
            system-ui, sans-serif;
          font-size: 13px;
          color: #1d1d1f;
        "
      >
        <div
          aria-hidden="true"
          style="
            position: absolute;
            left: -80px;
            top: 120px;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            background: #c9b79c;
          "
        ></div>
        <div
          style="
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            border-radius: 16px;
            overflow: hidden;
            background: rgba(246, 246, 246, 0.86);
            backdrop-filter: blur(30px) saturate(1.8);
            box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.16);
          "
        >
          <div
            style="
              height: 44px;
              flex-shrink: 0;
              display: flex;
              align-items: center;
              gap: 8px;
              padding: 0 8px 0 14px;
            "
          >
            <img
              src="/_blob/bec94b403e0b85e336d817de631c9138"
              alt=""
              style="width: 22px; height: 24px"
            />
            <span style="font-size: 13px; font-weight: 600">小黑</span>
            <span style="font-size: 11px; color: #6e6e73">自动</span>
            <div style="margin-left: auto; display: flex; gap: 2px">
              <button
                aria-label="新对话"
                style="
                  width: 28px;
                  height: 28px;
                  border-radius: 7px;
                  border: 0;
                  background: transparent;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  color: #6e6e73;
                "
              >
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M12 20h9"></path>
                  <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path>
                </svg>
              </button>
              <button
                aria-label="收起成胶囊"
                style="
                  width: 28px;
                  height: 28px;
                  border-radius: 7px;
                  border: 0;
                  background: transparent;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  color: #6e6e73;
                "
              >
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"></path>
                </svg>
              </button>
            </div>
          </div>

          <div
            style="
              flex-grow: 1;
              display: flex;
              flex-direction: column;
              gap: 14px;
              padding: 8px 16px 16px;
              overflow: hidden;
            "
          >
            <div
              style="
                align-self: flex-end;
                max-width: 78%;
                padding: 7px 12px;
                border-radius: 16px;
                background: #0a66d8;
                color: #ffffff;
                font-size: 13px;
                line-height: 1.45;
              "
            >
              帮我把今天的待办整理到 todo.md 里
            </div>

            <div
              style="
                display: flex;
                flex-direction: column;
                gap: 8px;
                max-width: 92%;
              "
            >
              <div
                style="
                  display: flex;
                  align-items: center;
                  gap: 6px;
                  font-size: 12px;
                  color: #6e6e73;
                "
              >
                <svg
                  width="13"
                  height="13"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="#248A3D"
                  stroke-width="2.4"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M20 6L9 17l-5-5"></path>
                </svg>
                <span>已写入 todo.md</span>
              </div>
              <p style="margin: 0; font-size: 13px; line-height: 1.55">
                整理好了，一共 5 件。最急的是下午 3
                点前回复设计评审，放在第一条。要我 2:30 提醒你吗？
              </p>
            </div>

            <div
              style="
                align-self: flex-end;
                max-width: 78%;
                padding: 7px 12px;
                border-radius: 16px;
                background: #0a66d8;
                color: #ffffff;
                font-size: 13px;
                line-height: 1.45;
              "
            >
              好，提醒我
            </div>

            <div
              style="
                display: flex;
                align-items: center;
                gap: 8px;
                font-size: 12px;
                color: #6e6e73;
              "
            >
              <img
                src="/_blob/28dc4e5d3b3fa73faf0af210dd25ea92"
                alt=""
                style="width: 30px; height: 32px"
              />
              <span>小黑在翻日历…</span>
            </div>
          </div>

          <div style="padding: 0 10px 10px">
            <div
              style="
                display: flex;
                align-items: center;
                gap: 4px;
                height: 38px;
                box-sizing: border-box;
                padding: 0 4px 0 12px;
                border-radius: 19px;
                background: rgba(255, 255, 255, 0.9);
                box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.14);
              "
            >
              <label
                for="chat-light-input"
                style="
                  position: absolute;
                  width: 1px;
                  height: 1px;
                  overflow: hidden;
                  clip: rect(0 0 0 0);
                "
                >消息</label
              >
              <input
                id="chat-light-input"
                placeholder="和小黑说句话…"
                style="
                  flex-grow: 1;
                  min-width: 0;
                  height: 30px;
                  border: 0;
                  outline: none;
                  background: transparent;
                  font-family: inherit;
                  font-size: 13px;
                  color: #1d1d1f;
                "
              />
              <button
                aria-label="停止"
                style="
                  width: 30px;
                  height: 30px;
                  flex-shrink: 0;
                  border-radius: 15px;
                  border: 0;
                  background: #1d1d1f;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                "
              >
                <span
                  style="
                    width: 9px;
                    height: 9px;
                    border-radius: 2px;
                    background: #ffffff;
                  "
                ></span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"$preview":{"width":380,"height":620}}'
    >
      class Component extends DCLogic {
        renderVals() {
          return {};
        }
      }
    </script>
  </body>
</html>
