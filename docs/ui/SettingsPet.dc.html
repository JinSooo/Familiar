<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>设置宠物</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <style>
          body {
            margin: 0;
          }
          a {
            color: #0a66d8;
          }
          a:hover {
            color: #0852ae;
          }
        </style>
      </helmet>
      <div
        style="
          width: 760px;
          height: 600px;
          box-sizing: border-box;
          display: flex;
          border-radius: 14px;
          overflow: hidden;
          background: #f5f5f5;
          box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.2);
          font-family:
            -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC',
            system-ui, sans-serif;
          font-size: 13px;
          color: #1d1d1f;
        "
      >
        <nav
          aria-label="设置分类"
          style="
            width: 200px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 1px;
            padding: 12px 10px;
            background: #e9e9eb;
            border-right: 0.5px solid rgba(0, 0, 0, 0.12);
          "
        >
          <div style="display: flex; gap: 8px; padding: 2px 4px 12px">
            <span
              style="
                width: 12px;
                height: 12px;
                border-radius: 50%;
                background: #ff5f57;
              "
            ></span>
            <span
              style="
                width: 12px;
                height: 12px;
                border-radius: 50%;
                background: #febc2e;
              "
            ></span>
            <span
              style="
                width: 12px;
                height: 12px;
                border-radius: 50%;
                background: #28c840;
              "
            ></span>
          </div>
          <label
            for="settings-search-pet"
            style="
              position: absolute;
              width: 1px;
              height: 1px;
              overflow: hidden;
              clip: rect(0 0 0 0);
            "
            >搜索</label
          >
          <input
            id="settings-search-pet"
            placeholder="搜索"
            style="
              height: 26px;
              box-sizing: border-box;
              margin-bottom: 10px;
              padding: 0 8px;
              border-radius: 7px;
              border: 0;
              background: rgba(0, 0, 0, 0.06);
              font-family: inherit;
              font-size: 13px;
            "
          />
          <a
            href="SettingsModel.dc.html"
            style="
              display: flex;
              align-items: center;
              gap: 8px;
              height: 28px;
              padding: 0 6px;
              border-radius: 7px;
              color: #1d1d1f;
              text-decoration: none;
            "
          >
            <span
              style="
                width: 20px;
                height: 20px;
                border-radius: 5px;
                background: #0a66d8;
                display: flex;
                align-items: center;
                justify-content: center;
                color: #ffffff;
              "
            >
              <svg
                width="12"
                height="12"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.4"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path
                  d="M12 2l3 7h7l-5.5 4.5L18 21l-6-4-6 4 1.5-7.5L2 9h7z"
                ></path>
              </svg> </span
            >模型</a
          >
          <a
            href="#permissions"
            style="
              display: flex;
              align-items: center;
              gap: 8px;
              height: 28px;
              padding: 0 6px;
              border-radius: 7px;
              color: #1d1d1f;
              text-decoration: none;
            "
          >
            <span
              style="
                width: 20px;
                height: 20px;
                border-radius: 5px;
                background: #8e8e93;
                display: flex;
                align-items: center;
                justify-content: center;
                color: #ffffff;
              "
            >
              <svg
                width="12"
                height="12"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.4"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <rect x="5" y="11" width="14" height="10" rx="2"></rect>
                <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
              </svg> </span
            >权限</a
          >
          <a
            href="#pet"
            style="
              display: flex;
              align-items: center;
              gap: 8px;
              height: 28px;
              padding: 0 6px;
              border-radius: 7px;
              background: #0a66d8;
              color: #ffffff;
              text-decoration: none;
            "
          >
            <span
              style="
                width: 20px;
                height: 20px;
                border-radius: 5px;
                background: #ffffff;
                display: flex;
                align-items: center;
                justify-content: center;
                color: #34a853;
              "
            >
              <svg
                width="12"
                height="12"
                viewBox="0 0 24 24"
                fill="currentColor"
                aria-hidden="true"
              >
                <circle cx="7" cy="9" r="2.2"></circle>
                <circle cx="17" cy="9" r="2.2"></circle>
                <circle cx="10" cy="5" r="2"></circle>
                <circle cx="14" cy="5" r="2"></circle>
                <path
                  d="M12 11c-3 0-6 3.5-6 6.5 0 2 2 2.5 3.5 2 1-.3 1.7-.6 2.5-.6s1.5.3 2.5.6c1.5.5 3.5 0 3.5-2 0-3-3-6.5-6-6.5z"
                ></path>
              </svg> </span
            >宠物</a
          >
          <a
            href="#privacy"
            style="
              display: flex;
              align-items: center;
              gap: 8px;
              height: 28px;
              padding: 0 6px;
              border-radius: 7px;
              color: #1d1d1f;
              text-decoration: none;
            "
          >
            <span
              style="
                width: 20px;
                height: 20px;
                border-radius: 5px;
                background: #2f7cf6;
                display: flex;
                align-items: center;
                justify-content: center;
                color: #ffffff;
              "
            >
              <svg
                width="12"
                height="12"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.4"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"></path>
              </svg> </span
            >隐私</a
          >
        </nav>

        <div
          style="
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
          "
        >
          <div
            style="
              height: 52px;
              flex-shrink: 0;
              display: flex;
              align-items: center;
              padding: 0 24px;
            "
          >
            <h1 style="margin: 0; font-size: 15px; font-weight: 600">宠物</h1>
            <button
              style="
                margin-left: auto;
                height: 22px;
                padding: 0 10px;
                border-radius: 5px;
                border: 0;
                background: #ffffff;
                box-shadow:
                  0 0 0 0.5px rgba(0, 0, 0, 0.2),
                  0 1px 1px rgba(0, 0, 0, 0.06);
                font-family: inherit;
                font-size: 13px;
                color: #1d1d1f;
              "
            >
              从 ChatGPT 导入…
            </button>
          </div>
          <div
            style="
              flex-grow: 1;
              display: flex;
              flex-direction: column;
              gap: 18px;
              padding: 4px 24px 24px;
              overflow: hidden;
            "
          >
            <div
              style="
                display: grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 12px;
              "
            >
              <button
                aria-pressed="true"
                style="
                  display: flex;
                  flex-direction: column;
                  align-items: center;
                  gap: 4px;
                  padding: 12px 8px 10px;
                  border-radius: 10px;
                  border: 0;
                  background: #ffffff;
                  box-shadow: 0 0 0 2.5px #0a66d8;
                  font-family: inherit;
                "
              >
                <img
                  src="/_blob/2db6bdd6ff1445c74ca0b0325f7085e5"
                  alt=""
                  style="width: 74px; height: 80px"
                />
                <span style="font-size: 13px; font-weight: 500; color: #1d1d1f"
                  >小黑</span
                >
                <span style="font-size: 11px; color: #6e6e73"
                  >内置 · 15 个动作</span
                >
              </button>
              <button
                aria-pressed="false"
                style="
                  display: flex;
                  flex-direction: column;
                  align-items: center;
                  gap: 4px;
                  padding: 12px 8px 10px;
                  border-radius: 10px;
                  border: 0;
                  background: #ffffff;
                  box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.1);
                  font-family: inherit;
                "
              >
                <img
                  src="/_blob/28dc4e5d3b3fa73faf0af210dd25ea92"
                  alt=""
                  style="width: 74px; height: 80px"
                />
                <span style="font-size: 13px; font-weight: 500; color: #1d1d1f"
                  >Xiao Hei</span
                >
                <span style="font-size: 11px; color: #6e6e73"
                  >来自 ChatGPT · 9 个动作</span
                >
              </button>
              <button
                aria-label="添加宠物文件夹"
                style="
                  display: flex;
                  flex-direction: column;
                  align-items: center;
                  justify-content: center;
                  gap: 6px;
                  padding: 12px 8px 10px;
                  border-radius: 10px;
                  border: 0;
                  background: rgba(0, 0, 0, 0.035);
                  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.12);
                  font-family: inherit;
                  color: #6e6e73;
                "
              >
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  aria-hidden="true"
                >
                  <path d="M12 5v14M5 12h14"></path>
                </svg>
                <span style="font-size: 12px">选择文件夹…</span>
              </button>
            </div>

            <div
              style="
                display: flex;
                flex-direction: column;
                border-radius: 10px;
                background: #ffffff;
                box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.1);
              "
            >
              <label
                style="
                  display: flex;
                  align-items: center;
                  gap: 12px;
                  min-height: 40px;
                  padding: 0 12px;
                "
              >
                <span style="flex-grow: 1">名字</span>
                <input
                  value="小黑"
                  style="
                    width: 180px;
                    height: 22px;
                    box-sizing: border-box;
                    padding: 0 6px;
                    border-radius: 5px;
                    border: 0;
                    background: #ffffff;
                    box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.22);
                    font-family: inherit;
                    font-size: 13px;
                    text-align: right;
                    color: #1d1d1f;
                  "
                />
              </label>
              <div
                style="
                  height: 0.5px;
                  margin-left: 12px;
                  background: rgba(0, 0, 0, 0.1);
                "
              ></div>
              <div
                style="
                  display: flex;
                  align-items: center;
                  gap: 12px;
                  min-height: 40px;
                  padding: 0 12px;
                "
              >
                <span style="flex-grow: 1">大小</span>
                <div
                  role="radiogroup"
                  aria-label="大小"
                  style="
                    display: flex;
                    padding: 2px;
                    border-radius: 7px;
                    background: rgba(0, 0, 0, 0.06);
                  "
                >
                  <button
                    role="radio"
                    aria-checked="false"
                    style="
                      height: 20px;
                      padding: 0 14px;
                      border: 0;
                      border-radius: 5px;
                      background: transparent;
                      font-size: 12px;
                      color: #1d1d1f;
                      font-family: inherit;
                    "
                  >
                    小
                  </button>
                  <button
                    role="radio"
                    aria-checked="true"
                    style="
                      height: 20px;
                      padding: 0 14px;
                      border: 0;
                      border-radius: 5px;
                      background: #ffffff;
                      box-shadow:
                        0 1px 2px rgba(0, 0, 0, 0.14),
                        0 0 0 0.5px rgba(0, 0, 0, 0.06);
                      font-size: 12px;
                      color: #1d1d1f;
                      font-family: inherit;
                    "
                  >
                    中
                  </button>
                  <button
                    role="radio"
                    aria-checked="false"
                    style="
                      height: 20px;
                      padding: 0 14px;
                      border: 0;
                      border-radius: 5px;
                      background: transparent;
                      font-size: 12px;
                      color: #1d1d1f;
                      font-family: inherit;
                    "
                  >
                    大
                  </button>
                </div>
              </div>
              <div
                style="
                  height: 0.5px;
                  margin-left: 12px;
                  background: rgba(0, 0, 0, 0.1);
                "
              ></div>
              <div
                style="
                  display: flex;
                  align-items: center;
                  gap: 12px;
                  min-height: 40px;
                  padding: 0 12px;
                "
              >
                <div
                  style="
                    display: flex;
                    flex-direction: column;
                    gap: 2px;
                    flex-grow: 1;
                  "
                >
                  <span>减少动态效果时只显示静止形象</span>
                  <span style="font-size: 11px; color: #6e6e73"
                    >跟随系统「辅助功能 › 显示」的设置</span
                  >
                </div>
                <button
                  role="switch"
                  aria-checked="true"
                  aria-label="减少动态效果时只显示静止形象"
                  style="
                    width: 38px;
                    height: 22px;
                    flex-shrink: 0;
                    border-radius: 11px;
                    border: 0;
                    padding: 2px;
                    background: #0a66d8;
                    display: flex;
                    justify-content: flex-end;
                  "
                >
                  <span
                    style="
                      width: 18px;
                      height: 18px;
                      border-radius: 50%;
                      background: #ffffff;
                      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
                    "
                  ></span>
                </button>
              </div>
            </div>
            <span
              style="
                padding: 0 12px;
                font-size: 11px;
                line-height: 1.5;
                color: #6e6e73;
              "
              >换皮只换外观，名字、性格和记忆都跟着它走。</span
            >
          </div>
        </div>
      </div>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"$preview":{"width":760,"height":600}}'
    >
      class Component extends DCLogic {
        renderVals() {
          return {};
        }
      }
    </script>
  </body>
</html>
