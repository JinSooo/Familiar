[package]
name = "familiar"
version = "0.2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-nspanel = "2.1"
tauri-plugin-opener = "2.7"
tauri-plugin-shell = "2.5.0"
tauri-plugin-global-shortcut = "=2.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
objc2-service-management = { version = "0.3.2", features = ["SMAppService"] }
tauri-plugin-updater = "2.14"

[features]
custom-protocol = ["tauri/custom-protocol"]
