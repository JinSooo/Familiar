<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="36" height="36">
  <!-- Menu bar template icon at 2x (shown at 18pt): only alpha matters, macOS tints it.
       Drawn on the 36px grid so straight edges and the eye holes land on whole pixels. -->
  <defs>
    <mask id="eyes" maskUnits="userSpaceOnUse" x="0" y="0" width="36" height="36">
      <rect width="36" height="36" fill="white"/>
      <rect x="11" y="18" width="4" height="6" rx="2" fill="black"/>
      <rect x="21" y="18" width="4" height="6" rx="2" fill="black"/>
    </mask>
  </defs>
  <g mask="url(#eyes)" fill="black">
    <rect x="3" y="10" width="30" height="23" rx="10"/>
    <path d="M5.5 18 L7 5.5 L15 11.5 Z M30.5 18 L29 5.5 L21 11.5 Z" stroke="black" stroke-width="3" stroke-linejoin="round"/>
  </g>
</svg>
