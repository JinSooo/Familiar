<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>展开的聊天面板深色与审批</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <style>
          body {
            margin: 0;
          }
          a {
            color: #4da3ff;
          }
          a:hover {
            color: #7dbbff;
          }
        </style>
      </helmet>
      <div
        style="
          width: 380px;
          height: 620px;
          position: relative;
          overflow: hidden;
          background: #2b3440;
          font-family:
            -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC',
            system-ui, sans-serif;
          font-size: 13px;
          color: #f5f5f7;
        "
      >
        <div
          aria-hidden="true"
          style="
            position: absolute;
            right: -100px;
            top: 60px;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            background: #3e4f63;
          "
        ></div>
        <div
          style="
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            border-radius: 16px;
            overflow: hidden;
            background: rgba(36, 36, 38, 0.86);
            backdrop-filter: blur(30px) saturate(1.6);
            box-shadow: inset 0 0 0 0.5px rgba(255, 255, 255, 0.14);
          "
        >
          <div
            style="
              height: 44px;
              flex-shrink: 0;
              display: flex;
              align-items: center;
              gap: 8px;
              padding: 0 8px 0 14px;
            "
          >
            <img
              src="/_blob/55ebbea59d7cb4ebbc26178939159aaa"
              alt=""
              style="width: 22px; height: 24px"
            />
            <span style="font-size: 13px; font-weight: 600">小黑</span>
            <span style="font-size: 11px; color: #ffd60a">等你决定</span>
            <div style="margin-left: auto; display: flex; gap: 2px">
              <button
                aria-label="新对话"
                style="
                  width: 28px;
                  height: 28px;
                  border-radius: 7px;
                  border: 0;
                  background: transparent;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  color: #a1a1a6;
                "
              >
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M12 20h9"></path>
                  <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path>
                </svg>
              </button>
              <button
                aria-label="收起成胶囊"
                style="
                  width: 28px;
                  height: 28px;
                  border-radius: 7px;
                  border: 0;
                  background: transparent;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  color: #a1a1a6;
                "
              >
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"></path>
                </svg>
              </button>
            </div>
          </div>

          <div
            style="
              flex-grow: 1;
              display: flex;
              flex-direction: column;
              gap: 14px;
              padding: 8px 16px 16px;
              overflow: hidden;
            "
          >
            <div
              style="
                align-self: flex-end;
                max-width: 78%;
                padding: 7px 12px;
                border-radius: 16px;
                background: #0b6fe0;
                color: #ffffff;
                font-size: 13px;
                line-height: 1.45;
              "
            >
              把桌面上的截图都挪到 ~/Pictures/截图 里
            </div>

            <p
              style="
                margin: 0;
                font-size: 13px;
                line-height: 1.55;
                color: #f5f5f7;
              "
            >
              桌面上有 23 张截图。目标目录在工作目录外面，要你同意一下。
            </p>

            <div
              style="
                display: flex;
                flex-direction: column;
                gap: 10px;
                padding: 12px;
                border-radius: 12px;
                background: rgba(255, 255, 255, 0.07);
                box-shadow: inset 0 0 0 0.5px rgba(255, 255, 255, 0.12);
              "
            >
              <div style="display: flex; align-items: center; gap: 8px">
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="#FFD60A"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M12 3l9 16H3z"></path>
                  <path d="M12 10v4M12 17h.01"></path>
                </svg>
                <span style="font-size: 13px; font-weight: 600"
                  >移动 23 个文件</span
                >
              </div>
              <div
                style="
                  display: flex;
                  flex-direction: column;
                  gap: 2px;
                  font-family: ui-monospace, 'SF Mono', Menlo, monospace;
                  font-size: 11px;
                  line-height: 1.5;
                  color: #c7c7cc;
                "
              >
                <span>~/Desktop/截屏*.png</span>
                <span style="color: #a1a1a6">→ ~/Pictures/截图/</span>
              </div>
              <div style="display: flex; align-items: center; gap: 8px">
                <a href="#always" style="font-size: 12px">总是允许这个目录</a>
                <button
                  style="
                    margin-left: auto;
                    height: 24px;
                    padding: 0 12px;
                    border-radius: 6px;
                    border: 0;
                    background: rgba(255, 255, 255, 0.14);
                    color: #f5f5f7;
                    font-size: 13px;
                    font-family: inherit;
                  "
                >
                  拒绝
                </button>
                <button
                  style="
                    height: 24px;
                    padding: 0 14px;
                    border-radius: 6px;
                    border: 0;
                    background: #0b6fe0;
                    color: #ffffff;
                    font-size: 13px;
                    font-weight: 500;
                    font-family: inherit;
                  "
                >
                  允许
                </button>
              </div>
            </div>
          </div>

          <div style="padding: 0 10px 10px">
            <div
              style="
                display: flex;
                align-items: center;
                gap: 4px;
                height: 38px;
                box-sizing: border-box;
                padding: 0 4px 0 12px;
                border-radius: 19px;
                background: rgba(255, 255, 255, 0.08);
                box-shadow: inset 0 0 0 0.5px rgba(255, 255, 255, 0.14);
              "
            >
              <label
                for="chat-dark-input"
                style="
                  position: absolute;
                  width: 1px;
                  height: 1px;
                  overflow: hidden;
                  clip: rect(0 0 0 0);
                "
                >消息</label
              >
              <input
                id="chat-dark-input"
                placeholder="和小黑说句话…"
                style="
                  flex-grow: 1;
                  min-width: 0;
                  height: 30px;
                  border: 0;
                  outline: none;
                  background: transparent;
                  font-family: inherit;
                  font-size: 13px;
                  color: #f5f5f7;
                "
              />
              <button
                aria-label="发送"
                style="
                  width: 30px;
                  height: 30px;
                  flex-shrink: 0;
                  border-radius: 15px;
                  border: 0;
                  background: rgba(255, 255, 255, 0.14);
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  color: #a1a1a6;
                "
              >
                <svg
                  width="14"
                  height="14"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.6"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M12 19V5M5 12l7-7 7 7"></path>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"$preview":{"width":380,"height":620}}'
    >
      class Component extends DCLogic {
        renderVals() {
          return {};
        }
      }
    </script>
  </body>
</html>
